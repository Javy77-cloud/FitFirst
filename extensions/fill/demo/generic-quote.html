<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Generic HO form (FitFirst Fill fallback)</title>
    <style>
      body {
        margin: 0;
        font: 14px/1.45 system-ui, sans-serif;
        background: #f6f6f6;
        color: #222;
      }
      header {
        background: #333;
        color: #fff;
        padding: 14px 20px;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 20px;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      span {
        display: block;
        color: #555;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        height: 34px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <header>Generic carrier form (label-matcher fallback)</header>
    <main>
      <p>No Harmony field names. Fill matches common labels only.</p>
      <form>
        <label>
          <span>Address</span>
          <input id="addr" />
        </label>
        <label>
          <span>Year built</span>
          <input id="built" />
        </label>
        <label>
          <span>Dwelling</span>
          <input id="dwelling" />
        </label>
        <label>
          <span>Occupancy</span>
          <select id="occ">
            <option value="">Select…</option>
            <option value="owner">Owner</option>
            <option value="tenant">Tenant</option>
          </select>
        </label>
      </form>
    </main>
  </body>
</html>
