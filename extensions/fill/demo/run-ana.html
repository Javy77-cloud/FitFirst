<!doctype html>
<html lang="en" data-ff-portal="harmony">
  <head>
    <meta charset="utf-8" />
    <title>FitFirst Fill — Ana smoke</title>
  </head>
  <body>
    <p>Engine smoke: Ana sheet → Harmony demo fields. Password must stay empty.</p>
    <form data-ff-portal="harmony">
      <label>Named Insured <input id="namedInsured" name="NamedInsured" /></label>
      <label>Property Address <input id="propertyAddress" name="PropertyAddress" /></label>
      <label>Year Built <input id="yearBuilt" name="YearBuilt" /></label>
      <label>Dwelling / Coverage A <input id="coverageA" name="CoverageA" /></label>
      <label>
        Occupancy
        <select id="occupancy" name="Occupancy">
          <option value="">Select…</option>
          <option value="OwnerOccupied">Owner Occupied</option>
          <option value="Tenant">Tenant Occupied</option>
        </select>
      </label>
      <label class="login-trap" style="display: none">
        Password <input id="password" name="password" type="password" />
      </label>
    </form>
    <pre id="result">running…</pre>
    <script src="../lib/sheet.js"></script>
    <script src="../lib/harmony.js"></script>
    <script src="../lib/fill.js"></script>
    <script>
      const sheet = {
        kind: "fitfirst.sheet",
        version: 1,
        tenantId: "11111111-1111-4111-8111-111111111111",
        dealId: "22222222-2222-4222-8222-222222222222",
        shopDate: "2026-09-02",
        carrierHint: {
          key: "tailrow",
          name: "Tailrow",
          portal: "Harmony",
          host: "agency.harmony-ins.com",
        },
        insured: { primary: "Ana Dib", namedInsured: "George Dib" },
        risk: {
          address1: "1098 Adige Ct SE",
          city: "Palm Bay",
          county: "Brevard",
          state: "FL",
          zip: "32909",
          line: "HO3",
          occupancy: "owner",
          yearBuilt: 1989,
          coverageA: 321000,
        },
      };
      const result = window.FitFirstFill.fillDocument(document, sheet);
      const payload = {
        ok: Boolean(result && result.ok),
        profile: result && result.profile,
        filled: result && result.filled,
        address: document.getElementById("propertyAddress").value,
        yearBuilt: document.getElementById("yearBuilt").value,
        coverageA: document.getElementById("coverageA").value,
        occupancy: document.getElementById("occupancy").value,
        namedInsured: document.getElementById("namedInsured").value,
        password: document.getElementById("password").value,
      };
      document.getElementById("result").textContent = JSON.stringify(payload, null, 2);
      document.title = payload.ok && payload.address === "1098 Adige Ct SE" && payload.password === ""
        ? "FILL_OK"
        : "FILL_FAIL";
    </script>
  </body>
</html>
